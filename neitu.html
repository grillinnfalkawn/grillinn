      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">When turned on, customers can choose when they want their order ready (e.g. "11:00 PM"). The chosen time prints prominently on the receipt and KOT, and shows in the dashboard pending queue. Turn this on before events with pre-orders (e.g. big match nights, parties, festivals), off for normal service.</div>' +
      '<div class="toggle-row"><span>Active</span><div id="preorderToggle" class="toggle-switch' + (preorder.active ? ' on' : '') + '" onclick="this.classList.toggle(\'on\')"></div></div>' +
      '<span class="field-label">Label shown to customer</span>' +
      '<input class="settings-input" id="preorderLabel" placeholder="e.g. When should your order be ready?" value="' + esc2(preorder.label || '').replace(/"/g,'&quot;') + '">' +
      '<span class="field-label">Time options (comma-separated)</span>' +
      '<input class="settings-input" id="preorderOptions" placeholder="e.g. ASAP, 7:00 PM, 8:00 PM, 9:00 PM, 10:00 PM, 11:00 PM" value="' + esc2(preorderOptionsStr).replace(/"/g,'&quot;') + '">' +
    '</div>';

  const dctl = currentSettings.delivery_control || {};
  const dstatus = currentSettings.delivery_status || { available: true };
  const deliveryControlHtml =
    '<div class="settings-section">' +
      '<div class="settings-section-title">🛵 Delivery Availability</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Turn off Delivery orders on a busy day, or automatically after a set time each day — Takeaway and Dine-In stay open. The website greys out Delivery and shows your message, and the server refuses any delivery order that slips through.</div>' +
      '<div style="font-size:0.85rem;font-weight:700;margin-bottom:0.8rem;padding:0.5rem 0.7rem;border-radius:8px;' + (dstatus.available ? 'background:rgba(74,222,128,0.12);color:var(--green);' : 'background:rgba(220,38,38,0.12);color:var(--red);') + '">' + (dstatus.available ? '✅ Delivery is currently available' : '⛔ Delivery is currently OFF') + '</div>' +
      '<div class="toggle-row"><span>Pause delivery orders now</span><div id="deliveryPauseToggle" class="toggle-switch' + (dctl.paused ? ' on' : '') + '" onclick="this.classList.toggle(\'on\')"></div></div>' +
      '<div class="toggle-row"><span>Automatically stop deliveries at a set time each day</span><div id="deliveryCutoffToggle" class="toggle-switch' + (dctl.cutoff_enabled ? ' on' : '') + '" onclick="this.classList.toggle(\'on\')"></div></div>' +
      '<span class="field-label">Daily cutoff time (deliveries stop at/after this)</span>' +
      '<input class="settings-input" type="time" id="deliveryCutoffTime" value="' + esc2(dctl.cutoff_time || '21:00') + '">' +
      '<span class="field-label">Message shown to customers when delivery is off</span>' +
      '<input class="settings-input" id="deliveryMessage" maxlength="200" placeholder="Delivery isn\'t available right now — Takeaway & Dine-In are open!" value="' + esc2(dctl.message || '').replace(/"/g,'&quot;') + '">' +
    '</div>';

  const podt = currentSettings.pos_disabled_types || {};
  const posDisabledHtml =
    '<div class="settings-section">' +
      '<div class="settings-section-title">🚫 POS Order Types</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Turn an order type OFF here to stop counter staff from manually keying it in at the POS — e.g. disable Dine In so those orders can only come from the website, while Takeaway and Delivery keep working from the counter. This has no effect on the website\'s own ordering flow. Owner-only, and each change asks for the dashboard password again to confirm — it saves immediately, it isn\'t part of the Save Settings button below.</div>' +
      ['Dine In', 'Takeaway', 'Delivery'].map(t =>
        '<div class="toggle-row"><span>Disable ' + t + ' orders from the POS</span><div id="posDisable_' + t.replace(/\s/g, '') + '" class="toggle-switch' + (podt[t] ? ' on' : '') + '" onclick="togglePosDisabledType(this,\'' + t + '\')"></div></div>'
      ).join('') +
    '</div>';

  const printerHtml =
    '<div class="settings-section">' +
      '<div class="settings-section-title">🖨️ Receipt Printer</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Which printer receipts and kitchen tickets go to. Leave on "Default" to use the printer set in orders.py. Print a test slip to confirm you picked the right device.</div>' +
      '<div id="printerPicker" style="color:var(--muted);font-size:0.85rem;">Loading printers…</div>' +
    '</div>';

  // Regular weekly opening hours. Built from currentSettings.weekly_hours if
  // present, otherwise sensible defaults. Saved as 7 entries (Sun..Sat).
  const DAY_LABELS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const wh = Array.isArray(currentSettings.weekly_hours) && currentSettings.weekly_hours.length === 7
    ? currentSettings.weekly_hours
    : [ {open:'11:00',close:'21:30'},{open:'11:00',close:'21:30'},{open:'11:00',close:'21:30'},
        {open:'11:00',close:'21:30'},{open:'11:00',close:'21:30'},{open:'11:00',close:'16:30'}, null ];
  const hoursRows = DAY_LABELS.map((label, i) => {
    const e = wh[i];
    const closed = !e;
    const o = e ? (e.open || '11:00') : '11:00';
    const c = e ? (e.close || '21:30') : '21:30';
    return '<div class="hours-row" data-day="' + i + '" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;padding:0.5rem 0;border-bottom:1px solid var(--border);">' +
        '<span style="width:88px;font-weight:700;font-size:0.9rem;">' + label + '</span>' +
        '<div class="toggle-row" style="margin:0;flex:0 0 auto;"><span style="font-size:0.8rem;color:var(--muted);margin-right:0.4rem;">Closed</span>' +
          '<div id="hrClosed' + i + '" class="toggle-switch' + (closed ? ' on' : '') + '" onclick="toggleHoursClosed(' + i + ')"></div></div>' +
        '<span id="hrOpenWrap' + i + '" style="display:' + (closed ? 'none' : 'flex') + ';align-items:center;gap:0.35rem;">' +
          '<input class="settings-input" type="time" id="hrOpen' + i + '" value="' + o + '" style="width:auto;margin:0;">' +
          '<span style="color:var(--muted);">to</span>' +
          '<input class="settings-input" type="time" id="hrClose' + i + '" value="' + c + '" style="width:auto;margin:0;">' +
        '</span>' +
      '</div>';
  }).join('');
  const hoursHtml =
    '<div class="settings-section">' +
      '<div class="settings-section-title">🕒 Opening Hours</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Your regular weekly hours. The website uses these to show "Open now" / "We reopen…" and to accept or hold online orders. Toggle <b>Closed</b> for a day off. For one-off holidays use Website Display → special days instead.</div>' +
      hoursRows +
    '</div>';

  const intro =
    '<div class="settings-intro">ℹ️ Out-of-stock changes save automatically. All other settings require manual saving.</div>';

  const ownerHtml =
    '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Change the owner (your) login password. It\'s stored only as a secure hash — never in plain text. If you ever forget it, there\'s a recovery step in your setup notes.</div>' +
    '<input class="settings-input" type="password" id="ownCurPw" placeholder="Current owner password" style="margin-bottom:0.5rem;" autocomplete="current-password">' +
    '<input class="settings-input" type="password" id="ownNewPw" placeholder="New owner password (min 4 chars)" style="margin-bottom:0.5rem;" autocomplete="new-password">' +
    '<input class="settings-input" type="password" id="ownNewPw2" placeholder="Re-type new password" style="margin-bottom:0.5rem;" autocomplete="new-password">' +
    '<button class="btn-reprint" onclick="saveOwnerPassword(this)">🔑 Change my password</button>';

  const managerHtml =
    '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">The manager account is a second login with limited access: no voiding orders, no Sales tab, and it can\'t edit Menu &amp; Prices or Backups &amp; Reports. Set a password here to enable it; leave blank and Save to remove it. The manager uses a <b>different password</b> from yours.</div>' +
    '<div id="managerStatus" style="font-size:0.85rem;font-weight:700;margin-bottom:0.6rem;"></div>' +
    '<input class="settings-input" type="password" id="mgrPwInput" placeholder="New manager password (min 4 chars)" style="margin-bottom:0.5rem;" autocomplete="new-password">' +
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;">' +
      '<button class="btn-reprint" onclick="saveManagerPassword(this)">💾 Set manager password</button>' +
      '<button class="btn-reprint" id="mgrClearBtn" onclick="clearManagerPassword(this)" style="display:none;">🗑️ Remove manager account</button>' +
    '</div>';

  const alertsHtml =
    '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">New orders trigger a sound, a desktop pop-up notification, a flashing browser tab, and an on-screen banner — so they\'re hard to miss even if you\'re working in another app or the speakers are off. Desktop notifications need a one-time permission from your browser.</div>' +
    '<div id="alertsStatusLine" style="font-size:0.85rem;font-weight:700;margin-bottom:0.6rem;"></div>' +
    '<button class="btn-reprint" onclick="testAlerts()">🔔 Test alert</button>';

  const pr = currentSettings.packing_rates || { pizza_small: 5, pizza_large: 7, footlong_sandwich: 5, chicken: 5, bowls: 8, snack_box: 3, wraps: 4, burgers: 0 };
  const packingRatesHtml =
    '<div class="settings-section">' +
      '<div class="settings-section-title">📦 Packing Charges</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Flat per-item packing fee for Delivery & Takeaway orders (items that come in their own box). Everything else packs free. Dine In is never charged. These can still be overridden per-order at POS or when accepting an online order.</div>' +
      [
        ['pizza_small', 'Pizza — Small / Pan (6")'],
        ['pizza_large', 'Pizza — Large / Regular (9")'],
        ['footlong_sandwich', 'Footlong, Sandwich & Garlic Bread'],
        ['chicken', 'Fried & Grilled Chicken (per box, up to 9 pcs)'],
        ['bowls', 'Pastas & Overloaded Fries (bowls)'],
        ['snack_box', 'Nuggets, Popcorn, Strips, Fries & Paneer Pops'],
        ['wraps', 'Wraps'],
        ['burgers', 'Burgers'],
      ].map(([key, label]) =>
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.6rem;padding:0.4rem 0;border-bottom:1px solid var(--border);">' +
          '<span style="font-size:0.88rem;">' + label + '</span>' +
          '<div style="display:flex;align-items:center;gap:0.3rem;"><span style="color:var(--muted);">₹</span><input class="settings-input" type="number" min="0" max="500" id="pkRate_' + key + '" value="' + (pr[key] != null ? pr[key] : 0) + '" style="width:80px;margin:0;text-align:right;"></div>' +
        '</div>'
      ).join('') +
    '</div>';


  // Driver activity — carried over from this page's old Controls tab.
  const driverOpts = ['<option value="">Choose a driver…</option>']
    .concat(drivers.map(d => '<option value="' + escapeHtml(d.phone || '') + '">' + escapeHtml(d.name || '') + '</option>')).join('');
  const driverActivityHtml =
    '<div class="settings-section"><div class="settings-section-title">📋 Driver Activity</div>' +
    (drivers.length
      ? '<select class="settings-input" id="ctrlDriverSel" onchange="ctrlLoadDriverActivity(this.value)">' + driverOpts + '</select><div id="ctrlDriverActivity"></div>'
      : '<div style="color:var(--muted);font-size:0.85rem;">No drivers added yet.</div>') +
    '</div>';

  const categories = [
    { key: 'offers', icon: '💰', title: 'Discounts & Offers', subtitle: 'Spend-and-save discounts and "buy X get Y free" deals', html: offerHtml + qtyOffersHtml },
    { key: 'website', icon: '🌐', title: 'Website Display', subtitle: 'Banner, special days, and pre-order time picker', html: bannerHtml + datesHtml + preorderHtml },
    { key: 'hours', icon: '🕒', title: 'Opening Hours', subtitle: 'Set your regular weekly opening & closing times', html: hoursHtml },
    { key: 'packing', icon: '🥡', title: 'Packing Charges', subtitle: 'Set the per-item packing fee for boxed items', html: packingRatesHtml },
    { key: 'availability', icon: '📦', title: 'Item Availability', subtitle: 'Mark items or whole groups out of stock', html: '<div id="stockSection"></div>' },
    { key: 'printer', icon: '🖨️', title: 'Receipt Printer', subtitle: 'Choose which printer to print orders on', html: printerHtml },
    { key: 'deliveryavail', icon: '🚦', title: 'Delivery Availability', subtitle: 'Pause deliveries or set a daily cutoff time', html: deliveryControlHtml },
    { key: 'drivers', icon: '🛵', title: 'Delivery Drivers', subtitle: 'The drivers you can assign to deliveries', html: driversHtml + driverActivityHtml },
    { key: 'menuprices', icon: '🍔', title: 'Menu & Prices', subtitle: 'Add, edit, or remove items and change prices', html: '<div id="menuTabContainer">Loading…</div>' },
    { key: 'posdisabled', icon: '🚫', title: 'POS Order Types', subtitle: 'Block an order type from being keyed in at the counter', html: posDisabledHtml },
    { key: 'owner', icon: '🔑', title: 'Owner Account', subtitle: 'Change your own login password', html: ownerHtml },
    { key: 'manager', icon: '👤', title: 'Manager Account', subtitle: 'Set or remove the limited-access manager login', html: managerHtml },
    { key: 'admin', icon: '💾', title: 'Backups & Reports', subtitle: 'Download a database backup or send the sales report', html: backupHtml + cloudHtml + reportScheduleHtml + reportHtml }
  ];
  if (!settingsActiveCategory || !categories.some(c => c.key === settingsActiveCategory)) settingsActiveCategory = categories[0].key;
  const activeCat = categories.find(c => c.key === settingsActiveCategory);

  const sidebarHtml = categories.map(c =>
    '<button class="settings-cat-item' + (c.key === settingsActiveCategory ? ' active' : '') + '" data-key="' + c.key + '" onclick="selectSettingsCategory(\'' + c.key + '\')">' +
      '<div class="settings-cat-icon">' + c.icon + '</div>' +
      '<div class="settings-cat-text"><div class="settings-cat-title">' + c.title + '</div><div class="settings-cat-sub">' + c.subtitle + '</div></div>' +
      '<span class="settings-cat-chev">›</span>' +
    '</button>'
  ).join('');

  // Every category is rendered into the DOM up front (only visibility changes
  // when you switch), so ONE Save button can save every field across every
  // category, and moving around never loses an unsaved edit.
  const contentPanelsHtml = categories.map(c =>
    '<div class="settings-panel" data-key="' + c.key + '" style="display:' + (c.key === settingsActiveCategory ? 'block' : 'none') + ';">' + c.html + '</div>'
  ).join('');

  main.className = 'main settings-wide';
  main.innerHTML = intro +
    '<div class="settings-shell' + (settingsDetailOpen ? ' is-detail' : '') + '" id="settingsShell">' +
      '<div class="settings-sidebar">' + sidebarHtml + '</div>' +
      '<div class="settings-content">' +
        '<button class="settings-back" onclick="closeSettingsDetail()">‹ All settings</button>' +
        '<div class="settings-content-header"><div class="settings-content-title" id="settingsContentTitle">' + activeCat.title + '</div><div class="settings-content-sub" id="settingsContentSub">' + activeCat.subtitle + '</div></div>' +
        '<div class="settings-content-body" id="settingsContentBody">' + contentPanelsHtml + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="save-bar-spacer"></div>';
  document.getElementById('saveBar').classList.add('visible');
  updateReportPreview();
  renderMenuTab();
  loadCloudSyncStatus();
  loadPrinters();
  loadStockSection();
}

function selectSettingsCategory(key) {
  settingsActiveCategory = key;
  settingsDetailOpen = true;
  document.querySelectorAll('.settings-panel').forEach(el => { el.style.display = (el.dataset.key === key) ? 'block' : 'none'; });
  document.querySelectorAll('.settings-cat-item').forEach(el => { el.classList.toggle('active', el.dataset.key === key); });
  const t = document.querySelector('.settings-cat-item[data-key="' + key + '"] .settings-cat-title');
  const s = document.querySelector('.settings-cat-item[data-key="' + key + '"] .settings-cat-sub');
  const ht = document.getElementById('settingsContentTitle'), hs = document.getElementById('settingsContentSub');
  if (ht && t) ht.textContent = t.textContent;
  if (hs && s) hs.textContent = s.textContent;
  const shell = document.getElementById('settingsShell');
  if (shell) shell.classList.add('is-detail');
  window.scrollTo(0, 0);
}

function closeSettingsDetail() {
  settingsDetailOpen = false;
  const shell = document.getElementById('settingsShell');
  if (shell) shell.classList.remove('is-detail');
  window.scrollTo(0, 0);
}

function discardSettingsChanges() {
  if (!confirm('Discard any unsaved changes?')) return;
  renderSettings();
}

function saveAllSettings() {
  const payload = collectSettingsFromForm();
  if (!payload) return;                // validation failed — message already shown
  const btn = document.getElementById('saveSettingsBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  dashFetch('/api/settings', { method: 'POST', body: JSON.stringify(payload) })
    .then(r => r.json().then(body => ({ status: r.status, body }))).then(({ status, body }) => {
      btn.disabled = false; btn.textContent = '💾 Save Settings';
      if (status === 200 && body.status === 'ok') { showControlToast('Settings saved.'); loadSettingsTab(); }
      else alert('Failed to save: ' + ((body && body.message) || 'Unknown error'));
    }).catch(() => { btn.disabled = false; btn.textContent = '💾 Save Settings'; alert('Could not reach the server — nothing was saved.'); });
}

function ctrlLoadDriverActivity(phone) {
  const box = document.getElementById('ctrlDriverActivity');
  if (!box) return;
  if (!phone) { box.innerHTML = ''; return; }
  box.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">Loading…</div>';
  authFetch(SERVER_URL + '/api/driver-activity?phone=' + encodeURIComponent(phone)).then(r => r.json()).then(data => {
    if (!data || data.status !== 'ok') { box.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">Could not load.</div>'; return; }
    const line = (t, sub) => '<div class="sales-row"><span>' + t + '</span><span>' + sub + '</span></div>';
    const actSys = data.active.system || [], actMan = data.active.manual || [], doneSys = data.delivered.system || [], doneMan = data.delivered.manual || [];
    let h = '<div style="font-size:0.8rem;font-weight:700;margin:0.5rem 0 0.4rem;">⏳ In progress (' + (actSys.length + actMan.length) + ')</div>';
    if (!actSys.length && !actMan.length) h += '<div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.4rem;">Nothing in progress.</div>';
    actSys.forEach(o => h += line('#' + escapeHtml(o.order_number) + ' ' + escapeHtml(o.customer_name || '') + ' <span style="color:var(--muted);">· ' + (o.item_count || 0) + ' item' + (o.item_count === 1 ? '' : 's') + '</span>', '₹' + (o.amount || 0)));
    actMan.forEach(m => h += line(escapeHtml(m.customer_name || '') + (m.ref_number ? ' #' + escapeHtml(m.ref_number) : '') + ' <span style="color:var(--muted);">· manual</span>', '₹' + (m.amount || 0)));
    h += '<div style="font-size:0.8rem;font-weight:700;margin:0.6rem 0 0.4rem;">✅ Recently delivered (' + (doneSys.length + doneMan.length) + ')</div>';
    if (!doneSys.length && !doneMan.length) h += '<div style="color:var(--muted);font-size:0.82rem;">None yet.</div>';
    doneSys.forEach(o => h += line('#' + escapeHtml(o.order_number) + ' ' + escapeHtml(o.customer_name || '') + ' <span style="color:var(--muted);">· ' + (o.item_count || 0) + ' item' + (o.item_count === 1 ? '' : 's') + '</span>', escapeHtml(o.delivered_at || '✓')));
    doneMan.forEach(m => h += line(escapeHtml(m.customer_name || ''), '✓'));
    box.innerHTML = h;
  }).catch(() => { box.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">Network error.</div>'; });
}

let _ctrlToastTimer = null;
function showControlToast(msg) {
  let t = document.getElementById('ctrlToast');
  if (!t) { t = document.createElement('div'); t.id = 'ctrlToast'; t.style.cssText = 'position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--flame);color:var(--white);padding:0.7rem 1.1rem;border-radius:10px;font-size:0.85rem;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.4);'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_ctrlToastTimer); _ctrlToastTimer = setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function authFetchPost(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Dash-Password': dashPassword, 'X-Dash-Role': 'owner' },
    body: JSON.stringify(body || {})
  });
}

// ── INIT ───────────────────────────────────────────────────
const savedPw = sessionStorage.getItem('gi_admin_auth_pw');
if (savedPw) {
  dashPassword = savedPw;
  showApp();
} else {
  document.getElementById('loginScreen').style.display = 'flex';
}
</script>
</body>
</html>
