<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="robots" content="noindex, nofollow">
<title>Grill Inn — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap');
  /* Same palette, type, and component language as the Grill Inn dashboard
     (orders.py) — this page is that dashboard's pocket-sized remote twin,
     so it should feel like the same product, not a separate tool. */
  :root{--black:#0f0f0f;--charcoal:#1a1a1a;--panel:#222;--border:#2e2e2e;--orange:#f97316;--red:#dc2626;--flame:#ea580c;--white:#f5f5f5;--muted:#888;--green:#4ade80;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-padding-top:var(--safe-top);}
  body{background:var(--black);color:var(--white);font-family:'Inter','Segoe UI',Arial,sans-serif;min-height:100%;
    padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);-webkit-tap-highlight-color:transparent;}

  /* ── Login ──────────────────────────────────────────────────────── */
  .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.2rem;}
  .login-box{background:var(--charcoal);border:1px solid var(--border);border-radius:16px;padding:2rem 1.6rem;width:100%;max-width:360px;}
  .login-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;font-weight:400;background:linear-gradient(135deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:1.6rem;}
  .login-input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--white);font-size:16px;padding:0.85rem 1rem;outline:none;margin-bottom:0.8rem;font-family:'Inter',sans-serif;}
  .login-input:focus{border-color:var(--orange);}
  .login-btn{width:100%;background:linear-gradient(135deg,var(--orange),var(--red));border:none;border-radius:10px;color:white;font-weight:700;padding:0.9rem;cursor:pointer;font-size:0.98rem;margin-top:0.4rem;}
  .login-error{color:var(--red);font-size:0.8rem;text-align:center;margin-top:0.7rem;min-height:1.1em;}

  /* ── Shell ──────────────────────────────────────────────────────── */
  .app{display:none;}
  .app.visible{display:block;}
  header{background:var(--charcoal);border-bottom:1px solid var(--border);padding:0.7rem 1rem 0.6rem;
    padding-top:calc(0.7rem + var(--safe-top));position:sticky;top:0;z-index:50;}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:0.6rem;margin-bottom:0.55rem;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:1.5px;
    background:linear-gradient(135deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  /* Horizontally-scrolling single-row strip — used for the tab bar and every
     quick-filter chip row, so a narrow phone screen never has to stack pills
     into extra rows: it swipes sideways instead. Scrollbar hidden since the
     chips themselves (and a slightly cut-off last one) are the affordance. */
  .scroll-strip{display:flex;flex-wrap:nowrap;gap:0.4rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;}
  .scroll-strip::-webkit-scrollbar{display:none;}
  .tabs{margin:0 -1rem;padding:0 1rem;}
  .tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:999px;color:var(--muted);cursor:pointer;
    font-weight:700;padding:0.48rem 0.85rem;font-size:0.8rem;min-height:36px;flex-shrink:0;white-space:nowrap;}
  .tab-btn.active{background:var(--flame);border-color:var(--flame);color:white;}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:999px;color:var(--muted);cursor:pointer;
    padding:0.4rem 0.75rem;font-size:0.74rem;font-weight:700;min-height:32px;flex-shrink:0;}
  .main{max-width:640px;margin:0 auto;padding:1rem;padding-bottom:calc(1.5rem + var(--safe-bottom));}

  /* ── Pill toggle switch — same shape as the dashboard's, not the round
     iOS-style switch this page used before. ── */
  .toggle-switch{position:relative;width:46px;height:26px;background:var(--panel);border:1px solid var(--border);
    border-radius:13px;cursor:pointer;flex-shrink:0;transition:background 0.15s,border-color 0.15s;}
  .toggle-switch.on{background:var(--flame);border-color:var(--flame);}
  .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:white;
    border-radius:50%;transition:left 0.15s;}
  .toggle-switch.on::after{left:22px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:0.6rem;padding:0.5rem 0;}

  /* ── Filters / search / quick buttons ──────────────────────────────── */
  .chip-row{margin-bottom:0.55rem;}
  .date-range-row{display:flex;gap:0.4rem;align-items:center;margin-bottom:0.9rem;flex-wrap:nowrap;}
  .date-range-row input[type="date"]{background:var(--panel);border:1px solid var(--border);border-radius:9px;
    color:var(--white);padding:0.5rem 0.5rem;font-size:14px;min-height:38px;width:132px;flex-shrink:0;}
  .date-range-row .to-label{color:var(--muted);font-size:0.8rem;flex-shrink:0;}
  .btn-quick{background:var(--panel);border:1px solid var(--border);border-radius:999px;color:var(--muted);
    font-weight:700;padding:0.5rem 0.85rem;cursor:pointer;font-size:0.79rem;min-height:36px;flex-shrink:0;white-space:nowrap;}
  .btn-quick.active{background:var(--flame);border-color:var(--flame);color:white;}
  .search-row{display:flex;gap:0.5rem;margin-bottom:1rem;}
  .search-input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--white);
    font-size:16px;padding:0.7rem 0.85rem;outline:none;min-height:44px;font-family:'Inter',sans-serif;}
  .search-input:focus{border-color:var(--orange);}

  /* ── Sales tab: gradient hero total + section/row breakdowns, matching
     the dashboard's Sales tab exactly. ── */
  .sales-summary-card{background:linear-gradient(135deg,var(--orange),var(--red));border-radius:14px;
    padding:1.3rem 1.1rem;margin-bottom:1.1rem;text-align:center;}
  .sales-total-label{font-size:0.78rem;color:rgba(255,255,255,0.85);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;}
  .sales-total-value{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;color:white;letter-spacing:1px;line-height:1.15;}
  .sales-total-sub{font-size:0.8rem;color:rgba(255,255,255,0.85);margin-top:0.15rem;}
  .sales-section{background:var(--charcoal);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:0.9rem;}
  .sales-section-title{font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:0.6rem;}
  .sales-row{display:flex;justify-content:space-between;gap:0.6rem;padding:0.42rem 0;border-bottom:1px solid var(--border);font-size:0.87rem;}
  .sales-row:last-child{border-bottom:none;}
  .sales-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .sales-row span:last-child{font-weight:700;color:var(--orange);flex-shrink:0;}
  .sales-empty,.empty-state{text-align:center;color:var(--muted);padding:3rem 1rem;font-size:0.9rem;}
  .loading{text-align:center;color:var(--muted);padding:2rem;font-size:0.85rem;}

  /* ── Order cards (History) — Bebas Neue order numbers, per-type and
     per-status colour coding, same as the dashboard. ── */
  .order-card{background:var(--charcoal);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:0.8rem;}
  .order-header{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.5rem;}
  .order-num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--orange);letter-spacing:1px;}
  .order-type-tag{font-size:0.68rem;font-weight:700;padding:0.22rem 0.6rem;border-radius:10px;background:var(--panel);color:var(--muted);white-space:nowrap;}
  .order-type-tag.Delivery{background:rgba(249,115,22,0.15);color:var(--orange);}
  .order-type-tag.Takeaway{background:rgba(74,222,128,0.15);color:var(--green);}
  .order-type-tag.Dine-In{background:rgba(96,165,250,0.15);color:#60a5fa;}
  .order-meta{font-size:0.78rem;color:var(--muted);line-height:1.55;margin-bottom:0.55rem;}
  .order-items{background:var(--panel);border-radius:9px;padding:0.6rem 0.75rem;margin-bottom:0.55rem;font-size:0.85rem;}
  .order-item-row{display:flex;justify-content:space-between;gap:0.5rem;padding:0.18rem 0;}
  .order-total{font-weight:700;color:var(--orange);border-top:1px solid var(--border);margin-top:0.4rem;padding-top:0.4rem;text-align:right;}
  .status-tag{font-size:0.68rem;font-weight:700;padding:0.22rem 0.6rem;border-radius:10px;margin-top:0.15rem;display:inline-block;}
  .status-tag.printed{background:rgba(74,222,128,0.15);color:var(--green);}
  .status-tag.pending{background:rgba(249,115,22,0.15);color:var(--orange);}
  .status-tag.rejected,.status-tag.cancelled,.status-tag.print_failed{background:rgba(220,38,38,0.15);color:var(--red);}
  .status-tag.voided{background:rgba(148,163,184,0.15);color:var(--muted);}
  .top-items-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.4rem 0;border-bottom:1px solid var(--border);}
  .top-items-row:last-child{border-bottom:none;}

  /* Order-card action buttons get comfortable phone-sized tap targets. */
  .order-card .btn-quick{min-height:40px;}

  /* ── Controls tab: same "settings-section" card as the dashboard's
     Settings screen, instead of the borrowed stat-card this page used
     before. ── */
  .settings-section{background:var(--charcoal);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:0.9rem;}
  .settings-section-title{font-size:0.95rem;font-weight:800;color:var(--white);margin-bottom:0.7rem;display:flex;align-items:center;gap:0.4rem;}
  .settings-section-note{font-size:0.78rem;color:var(--muted);margin-bottom:0.6rem;line-height:1.5;}

  /* ── Empty-state, skeletons, motion (unchanged in spirit, recoloured) ── */
  .skeleton-card{background:var(--charcoal);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:0.8rem;position:relative;overflow:hidden;min-height:76px;}
  .skeleton-line{height:12px;border-radius:6px;background:var(--panel);margin-bottom:0.6rem;}
  .skeleton-line.w40{width:40%;} .skeleton-line.w70{width:70%;} .skeleton-line.w55{width:55%;margin-bottom:0;}
  .skeleton-card::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,0.05) 50%,transparent 70%);background-size:200% 100%;animation:skShimmer 1.3s ease-in-out infinite;}
  @keyframes skShimmer{0%{background-position:150% 0;}100%{background-position:-50% 0;}}

  .rise-in{animation:riseIn 0.35s ease both;}
  .order-card{animation:riseIn 0.35s ease both;}
  .order-card:nth-child(2){animation-delay:0.04s;} .order-card:nth-child(3){animation-delay:0.08s;}
  .order-card:nth-child(4){animation-delay:0.12s;} .order-card:nth-child(5){animation-delay:0.16s;}
  .order-card:nth-child(n+6){animation-delay:0.2s;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .tab-btn,.btn-quick,.login-btn,.logout-btn,.toggle-switch{transition:transform 0.12s ease,background 0.2s,border-color 0.2s,color 0.2s;}
  .tab-btn:active,.btn-quick:active,.login-btn:active,.logout-btn:active,.toggle-switch:active{transform:scale(0.96);}
  .order-card,.sales-section,.settings-section{transition:border-color 0.2s;}

  .login-box.shake{animation:loginShake 0.4s ease;}
  @keyframes loginShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  button:focus-visible,input:focus-visible,.toggle-switch:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  /* ── Mobile-first sizing ──────────────────────────────────────────
     16px on every text/number/date input avoids iOS's automatic zoom on
     focus; buttons keep a ~38-44px tap target throughout. Content also
     never has to scroll sideways, whatever the screen width. */
  input,select,textarea{font-size:16px;}
  body{overflow-x:hidden;}
  @media (max-width:420px){
    .logo{font-size:1.3rem;}
    .sales-total-value{font-size:2.2rem;}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}

  /* ── Settings tab: ported from the dashboard's Settings screen (same classes, same look) ── */
  .settings-section{background:var(--charcoal);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;}
  .settings-section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:0.8rem;}
  .field-label{font-size:0.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:0.25rem;}
  .settings-input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:0.9rem;padding:0.6rem 0.75rem;outline:none;margin-bottom:0.8rem;}
  .settings-input:focus{border-color:var(--orange);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;}
  .special-date-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:0.8rem;margin-bottom:0.6rem;}
  .special-date-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .btn-add-date{width:100%;background:var(--panel);border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-weight:700;padding:0.7rem;cursor:pointer;font-size:0.85rem;margin-bottom:0.6rem;}
  .btn-remove-date{background:none;border:none;color:var(--red);cursor:pointer;font-size:0.9rem;font-weight:700;}
  .row-2col{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}
  .banner-preset-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.6rem;}
  .banner-preset-btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-weight:600;padding:0.4rem 0.7rem;cursor:pointer;font-size:0.78rem;white-space:nowrap;}
  .btn-confirm{flex:1;background:linear-gradient(135deg,var(--green),#16a34a);border:none;border-radius:8px;color:white;font-weight:700;padding:0.7rem;cursor:pointer;font-size:0.9rem;}
  .btn-reject{background:var(--panel);border:1px solid var(--red);border-radius:8px;color:var(--red);font-weight:700;padding:0.7rem 1rem;cursor:pointer;font-size:0.9rem;}
  .btn-reprint{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-weight:700;padding:0.5rem 0.9rem;cursor:pointer;font-size:0.8rem;}
  .pos-preset-btn{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-weight:700;padding:0.45rem;cursor:pointer;font-size:0.8rem;}
  .settings-intro{font-size:0.9rem;color:var(--muted);line-height:1.55;margin-bottom:1.1rem;padding:0.85rem 1rem;background:rgba(240,138,42,0.06);border:1px solid rgba(240,138,42,0.2);border-radius:8px;}
  .stock-toggle-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;font-size:0.85rem;color:var(--white);cursor:pointer;border-bottom:1px solid var(--border);}
  .stock-toggle-row input{width:18px;height:18px;cursor:pointer;flex-shrink:0;}
  .stock-count{color:var(--muted);font-size:0.75rem;}
  .stock-group-block{border-bottom:1px solid var(--border);}
  .stock-group-block .stock-toggle-row{border-bottom:none;}
  .stock-group-items{background:rgba(255,255,255,0.03);border-left:2px solid var(--orange);margin-left:0.5rem;}
  .stock-group-items .stock-toggle-row{border-bottom:1px dashed var(--border);}
  .cart-item-name{font-size:0.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-item-price{font-weight:700;color:var(--orange);}
  .menu-item-card{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem;}
  .settings-content-header{margin-bottom:1.3rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
  .settings-content-title{font-size:1.5rem;font-weight:800;color:var(--white);}
  .settings-content-sub{font-size:0.85rem;color:var(--muted);margin-top:0.35rem;}
  .settings-cat-icon{width:36px;height:36px;border-radius:9px;background:var(--panel);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .settings-cat-title{font-size:0.87rem;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .settings-cat-sub{font-size:0.71rem;color:var(--muted);margin-top:0.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn-save{background:linear-gradient(135deg,var(--orange),var(--red));
            border:none;border-radius:10px;color:white;font-weight:800;padding:0.85rem 1.9rem;cursor:pointer;
            font-size:0.95rem;letter-spacing:0.3px;transition:transform 0.1s,filter 0.15s;}
  .btn-discard{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:700;
              padding:0.85rem 1.4rem;border-radius:10px;cursor:pointer;font-size:0.9rem;font-family:'Inter',sans-serif;}
  .settings-input{font-size:16px;}             /* 16px stops iOS zooming into a focused field */
  .settings-save-btn{background:linear-gradient(135deg,var(--orange),var(--red));border:none;border-radius:8px;color:white;font-weight:700;padding:0.7rem 1rem;cursor:pointer;font-size:0.9rem;width:100%;}
  .menu-items-grid{display:grid;grid-template-columns:1fr;gap:0.6rem;margin-top:0.6rem;}
  .toggle-row{padding:0;gap:0.6rem;}
  .main.settings-wide{max-width:none;}
  .settings-shell{display:block;}
  .settings-sidebar{display:flex;flex-direction:column;gap:0.5rem;}
  .settings-cat-item{display:flex;align-items:center;gap:0.75rem;width:100%;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
    background:var(--charcoal);border:1px solid var(--border);border-radius:12px;padding:0.7rem 0.8rem;color:var(--white);}
  .settings-cat-text{min-width:0;flex:1;}
  .settings-cat-sub{display:block;font-size:0.72rem;color:var(--muted);margin-top:0.12rem;line-height:1.35;}
  .settings-cat-title{white-space:normal;}
  .settings-cat-chev{color:var(--muted);font-size:1.4rem;line-height:1;flex-shrink:0;}
  .settings-cat-item.active .settings-cat-title{color:var(--orange);}
  .settings-content{display:none;min-width:0;}
  .settings-shell.is-detail .settings-sidebar{display:none;}
  .settings-shell.is-detail .settings-content{display:block;}
  .settings-back{background:none;border:none;color:var(--orange);font-weight:700;font-size:0.9rem;cursor:pointer;padding:0.2rem 0 0.7rem;font-family:'Inter',sans-serif;}
  .settings-content-title{font-size:1.25rem;}
  .settings-intro{margin-bottom:0.9rem;font-size:0.8rem;padding:0.7rem 0.85rem;}
  .stock-toggle-row{min-height:44px;}
  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:none;justify-content:flex-end;align-items:center;gap:0.6rem;
    padding:0.7rem 1rem calc(0.7rem + var(--safe-bottom));background:rgba(20,15,9,0.92);backdrop-filter:blur(8px);
    border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,0.45);}
  .save-bar.visible{display:flex;}
  .save-bar .btn-save{flex:1;padding:0.8rem 1rem;}
  .save-bar .btn-discard{padding:0.8rem 1rem;}
  .save-bar-spacer{height:calc(5rem + var(--safe-bottom));}
  .banner-preset-btn{min-height:36px;}
  @media (max-width:520px){ .row-2col{grid-template-columns:1fr;} .row-2col.keep2{grid-template-columns:1fr 1fr;} }
  @media (min-width:820px){
    .main.settings-wide{padding:1.5rem 2rem;padding-bottom:calc(1.5rem + var(--safe-bottom));}
    .settings-shell{display:flex;align-items:flex-start;}
    .settings-sidebar,.settings-shell.is-detail .settings-sidebar{display:flex;width:30%;max-width:320px;flex-shrink:0;gap:0.25rem;padding-right:1.2rem;border-right:1px solid var(--border);}
    .settings-cat-item{background:none;border:none;border-left:3px solid transparent;border-radius:8px;padding:0.5rem 0.7rem;}
    .settings-cat-item:hover{background:rgba(255,255,255,0.04);}
    .settings-cat-item.active{background:rgba(249,115,22,0.1);border-left-color:var(--orange);}
    .settings-cat-sub{display:none;}
    .settings-cat-chev{display:none;}
    .settings-content,.settings-shell.is-detail .settings-content{display:block;flex:1;padding-left:1.8rem;}
    .settings-back{display:none;}
    .settings-content-title{font-size:1.5rem;}
    .menu-items-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
    .save-bar{padding-left:2rem;padding-right:2rem;}
    .save-bar .btn-save{flex:0 0 auto;padding:0.85rem 1.9rem;}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">🔒 Grill Inn Admin</div>
    <input type="password" class="login-input" id="loginPassword" placeholder="Dashboard Password" autocomplete="current-password">
    <button class="login-btn" onclick="attemptLogin()">Log In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <div class="header-top">
      <div class="logo">Grill Inn Admin</div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
    <div class="tabs scroll-strip">
      <button class="tab-btn active" id="salesTab" onclick="switchTab('sales')">📊 Sales</button>
      <button class="tab-btn" id="historyTab" onclick="switchTab('history')">📋 History</button>
      <button class="tab-btn" id="settingsTab" onclick="switchTab('settings')">⚙️ Settings</button>
      <!-- Prediction/giveaway tab disabled — re-enable with the blueprint in orders.py.
      <button class="tab-btn" id="worldcupTab" onclick="switchTab('worldcup')">🏆 World Cup</button> -->
    </div>
  </header>
  <div id="offlineBanner" style="display:none;background:rgba(220,38,38,0.15);color:var(--red);border-bottom:1px solid var(--red);font-weight:700;font-size:0.78rem;text-align:center;padding:0.5rem;">
    ⚠️ OFFLINE TEST MODE — not connected to the real server, nothing shown here is live data
  </div>
  <div class="main" id="mainContent"></div>
</div>

<div class="save-bar" id="saveBar"><button class="btn-discard" onclick="discardSettingsChanges()">Discard Changes</button><button class="btn-save" id="saveSettingsBtn" onclick="saveAllSettings()">💾 Save Settings</button></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
// This page uses the SAME password as your dashboard (orders.py's
// DASHBOARD_PASSWORD) — checked for real on the server for every
// request, not just here in the browser. Nothing secret is stored in
// this file; you type the password in each time you log in.
const SERVER_URL = "https://orders.grillinnfalkawn.in";
// ─────────────────────────────────────────────────────────

// TESTING/OFFLINE ONLY: if the real server can't be reached at all (the
// fetch below throws — no wifi, DNS down, server offline), this password
// lets you into the shell of the app anyway so you can preview the layout.
// It does NOT touch the real server or grant access to real data — every
// tab still tries to fetch from SERVER_URL and will show its own "could
// not reach the server" state once you're in, since there's no server to
// answer. It only ever activates when the real login request fails to
// even reach the server; a wrong real password still says "Incorrect
// password" as normal. Change or remove this before handing the file to
// anyone else.
const OFFLINE_TEST_PASSWORD = '0000';
let offlineMode = false;

let currentTab = 'sales';
let historyDate = toDateStr(new Date());
let historySearchQuery = '';
let historySearchAllDates = false;
let historyTypeFilter = [];   // selected order types to include; [] = all types
let historyStatusFilter = []; // selected statuses to include; [] = all statuses
let dashPassword = '';

// Escapes text before it's inserted into HTML. Names, addresses, item
// notes and reasons are typed by customers/staff — without this, an order
// placed with markup in a field could inject script into this admin page
// (and this page holds the dashboard password in the session).
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// All authenticated requests send the password as a header, not a
// ?password= query parameter — query strings end up in Cloudflare/proxy
// access logs and browser history; headers don't.
function authFetch(url) {
  // neitu is the OWNER's remote console — always claims the owner role, so the
  // server rejects a manager password here (this page is owner-only).
  return fetch(url, { headers: { 'X-Dash-Password': dashPassword, 'X-Dash-Role': 'owner' } });
}

const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Placeholder cards shaped like the incoming content, shown while a fetch
// is in flight.
function skeletonCards(n) {
  let html = '';
  for (let i = 0; i < n; i++) {
    html += '<div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w70"></div><div class="skeleton-line w55"></div></div>';
  }
  return html;
}

// Counts a stat up from 0 to its final value over ~0.5s. Values render
// instantly for anyone with reduced motion enabled.
function countUpStats() {
  document.querySelectorAll('[data-countup]').forEach(el => {
    const target = parseInt(el.getAttribute('data-countup'), 10);
    const prefix = el.getAttribute('data-prefix') || '';
    if (REDUCED_MOTION || isNaN(target) || target <= 0) { el.textContent = prefix + (isNaN(target) ? '0' : target); return; }
    const start = performance.now(), dur = 500;
    function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = prefix + Math.round(target * eased);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function attemptLogin() {
  const p = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = 'Checking...';
  fetch(SERVER_URL + '/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: p, role: 'owner' })
  }).then(r => r.json().then(res => ({ status: r.status, res }))).then(({ status, res }) => {
    if (status === 200 && res.status === 'ok') {
      dashPassword = p;
      sessionStorage.setItem('gi_admin_auth_pw', p);
      showApp();
    } else if (status === 403 && res.reason === 'role_mismatch') {
      // A valid password, but not the OWNER's — neitu is owner-only.
      errEl.textContent = 'This remote console is for the owner account only.';
      const box = document.querySelector('.login-box');
      if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    } else {
      errEl.textContent = 'Incorrect password.';
      const box = document.querySelector('.login-box');
      if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    }
  }).catch(e => {
    // Real network failure (not a rejected password — that's the branches
    // above). Offer the offline test password as a fallback so the app's
    // layout can still be checked with no server available.
    if (p === OFFLINE_TEST_PASSWORD) {
      dashPassword = p;
      offlineMode = true;
      showApp();
      return;
    }
    errEl.textContent = 'Could not reach the server. Check your connection.';
  });
}

document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

function logout() {
  sessionStorage.removeItem('gi_admin_auth_pw');
  dashPassword = '';
  offlineMode = false;
  currentSettings = {}; currentMenu = {}; settingsDetailOpen = false;
  const _sb = document.getElementById('saveBar'); if (_sb) _sb.classList.remove('visible');
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  const banner = document.getElementById('offlineBanner');
  if (banner) banner.style.display = offlineMode ? 'block' : 'none';
  switchTab('sales');
}

// If any request comes back 401, the password is wrong/changed since —
// send back to the login screen rather than showing empty data.
function handleUnauthorized() {
  alert('Session expired or password changed — please log in again.');
  logout();
}

function switchTab(tab) {
  if (tab === 'controls') tab = 'settings';       // old name of this tab
  currentTab = tab;
  const main = document.getElementById('mainContent');
  if (tab !== 'settings') {
    // Leaving Settings: back to the normal narrow column, hide the save bar.
    main.className = 'main';
    const sb = document.getElementById('saveBar'); if (sb) sb.classList.remove('visible');
  }
  document.getElementById('salesTab').classList.toggle('active', tab === 'sales');
  document.getElementById('historyTab').classList.toggle('active', tab === 'history');
  document.getElementById('settingsTab').classList.toggle('active', tab === 'settings');
  // document.getElementById('worldcupTab').classList.toggle('active', tab === 'worldcup');
  if (tab === 'sales') loadSales('today');
  else if (tab === 'settings') loadSettingsTab();
  // else if (tab === 'worldcup') loadWorldCup();
  else loadHistory();
}

// ── SALES SUMMARY ─────────────────────────────────────────
let salesStart = toDateStr(new Date());
let salesEnd = toDateStr(new Date());
let activeQuick = 'today';

function loadSales(quick) {
  const main = document.getElementById('mainContent');
  const today = new Date();

  if (quick === 'today') { salesStart = salesEnd = toDateStr(today); activeQuick = 'today'; }
  else if (quick === 'yesterday') { const y = new Date(today); y.setDate(y.getDate()-1); salesStart = salesEnd = toDateStr(y); activeQuick = 'yesterday'; }
  else if (quick === 'week') { const w = new Date(today); w.setDate(w.getDate()-6); salesStart = toDateStr(w); salesEnd = toDateStr(today); activeQuick = 'week'; }
  else if (quick === 'month') { const m = new Date(today); m.setDate(m.getDate()-29); salesStart = toDateStr(m); salesEnd = toDateStr(today); activeQuick = 'month'; }
  else { activeQuick = 'custom'; }

  main.innerHTML = renderSalesFilters() + skeletonCards(3);

  authFetch(SERVER_URL + '/api/sales-summary?start=' + salesStart + '&end=' + salesEnd)
    .then(r => { if (r.status === 401) { handleUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
    .then(data => renderSales(data))
    .catch(e => {
      if (e.message === 'unauthorized') return;
      main.innerHTML = renderSalesFilters() + '<div class="empty-state">Could not load sales data. Check your connection.</div>';
    });
}

function renderSalesFilters() {
  return '<div class="chip-row scroll-strip">' +
    ['today','yesterday','week','month'].map(q =>
      '<button class="btn-quick ' + (activeQuick === q ? 'active' : '') + '" onclick="loadSales(\'' + q + '\')">' +
        ({today:'Today',yesterday:'Yesterday',week:'Last 7 Days',month:'Last 30 Days'})[q] + '</button>'
    ).join('') +
  '</div>' +
  '<div class="date-range-row">' +
    '<input type="date" value="' + salesStart + '" onchange="salesStart=this.value;loadSales(\'custom\')">' +
    '<span class="to-label">to</span>' +
    '<input type="date" value="' + salesEnd + '" onchange="salesEnd=this.value;loadSales(\'custom\')">' +
  '</div>';
}

function renderSales(data) {
  const main = document.getElementById('mainContent');

  if (!data.total_orders) {
    main.innerHTML = renderSalesFilters() + '<div class="sales-empty">📭 No confirmed orders in this date range.</div>';
    return;
  }

  const heroHtml =
    '<div class="sales-summary-card">' +
      '<div class="sales-total-label">Total Revenue</div>' +
      '<div class="sales-total-value" data-countup="' + (data.total_revenue || 0) + '" data-prefix="₹">₹0</div>' +
      '<div class="sales-total-sub">' + data.total_orders + ' confirmed order' + (data.total_orders === 1 ? '' : 's') + ' · ' + data.start_date + (data.start_date !== data.end_date ? ' to ' + data.end_date : '') + '</div>' +
    '</div>';

  const byTypeHtml = data.by_type.map(t =>
    '<div class="sales-row"><span>' + escapeHtml(t.type) + '</span><span>' + t.count + ' · ₹' + t.revenue + '</span></div>'
  ).join('');

  const bySourceHtml = data.by_source.map(s =>
    '<div class="sales-row"><span>' + (s.source === 'pos' ? '🧾 POS' : '🌐 Website') + '</span><span>' + s.count + ' · ₹' + s.revenue + '</span></div>'
  ).join('');

  const topItemsHtml = data.top_items.map(it =>
    '<div class="sales-row"><span>' + it.qty + '× ' + escapeHtml(it.name) + '</span><span>₹' + it.revenue + '</span></div>'
  ).join('');

  main.innerHTML = renderSalesFilters() + '<div class="rise-in">' + heroHtml +
    (byTypeHtml ? '<div class="sales-section"><div class="sales-section-title">By Order Type</div>' + byTypeHtml + '</div>' : '') +
    (bySourceHtml ? '<div class="sales-section"><div class="sales-section-title">By Source</div>' + bySourceHtml + '</div>' : '') +
    (topItemsHtml ? '<div class="sales-section"><div class="sales-section-title">Top Items</div>' + topItemsHtml + '</div>' : '') +
  '</div>';
  countUpStats();
}

// ── ORDER HISTORY ─────────────────────────────────────────
function loadHistory() {
  const main = document.getElementById('mainContent');
  main.innerHTML = renderHistoryFilters() + skeletonCards(4);

  // One endpoint now for every combination: a text search (order #, phone,
  // name, or an item in the order — "pasta" finds every order containing a
  // pasta dish), an order-type filter, and a status filter (e.g. just
  // voided orders) — all narrowing the same result set together.
  const params = new URLSearchParams();
  if (historySearchQuery) params.set('q', historySearchQuery);
  if (!(historySearchQuery && historySearchAllDates)) params.set('date', historyDate);
  if (historyTypeFilter.length) params.set('types', historyTypeFilter.join(','));
  if (historyStatusFilter.length) params.set('statuses', historyStatusFilter.join(','));

  authFetch(SERVER_URL + '/api/search-orders?' + params.toString())
    .then(r => { if (r.status === 401) { handleUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
    .then(orders => renderHistory(orders))
    .catch(e => {
      if (e.message === 'unauthorized') return;
      main.innerHTML = renderHistoryFilters() + '<div class="empty-state">Could not load orders. Check your connection.</div>';
    });
}

function renderHistoryFilters() {
  const isToday = historyDate === toDateStr(new Date());
  const hasActiveFilters = !!historySearchQuery || historyTypeFilter.length > 0 || historyStatusFilter.length > 0;

  // Order-type and status filters are multi-select chips — tap toggles
  // that one value in/out of the list; [] on either means "no filter on
  // that dimension". Same horizontally-scrolling single-row strip as the
  // rest of this page, so a phone screen never has to stack them into
  // extra rows.
  const typeOptions = ['Delivery', 'Takeaway', 'Dine In'];
  const statusOptions = [
    ['printed', '✅ Printed'], ['print_failed', '⚠️ Print Failed'], ['voided', '🚫 Voided'],
    ['cancelled', '🚫 Cancelled'], ['rejected', '✕ Rejected']
  ];

  const typeChipsHtml = '<div class="chip-row scroll-strip">' +
    typeOptions.map(t =>
      '<button class="btn-quick ' + (historyTypeFilter.includes(t) ? 'active' : '') + '" onclick="toggleHistoryTypeFilter(&quot;' + t + '&quot;)">' + t + '</button>'
    ).join('') +
  '</div>';

  const statusChipsHtml = '<div class="chip-row scroll-strip">' +
    statusOptions.map(([val, label]) =>
      '<button class="btn-quick ' + (historyStatusFilter.includes(val) ? 'active' : '') + '" onclick="toggleHistoryStatusFilter(&quot;' + val + '&quot;)">' + label + '</button>'
    ).join('') +
  '</div>';

  // "Clear all" lives in the date row, not at the end of the scrolling
  // status strip — there it would sit off-screen to the right on a phone,
  // and putting it at the front would make the chips jump sideways every
  // time a filter is toggled. The date row has spare room and never shifts.
  return '<div class="date-range-row">' +
      '<button class="btn-quick ' + (isToday && !historySearchAllDates ? 'active' : '') + '" onclick="setHistoryDate(null)">Today</button>' +
      '<input type="date" value="' + historyDate + '" onchange="setHistoryDate(this.value)">' +
      (hasActiveFilters ? '<button class="btn-quick" style="margin-left:auto;color:var(--red);border-color:var(--red);" onclick="clearHistoryFilters()">✕ Clear</button>' : '') +
    '</div>' +
    typeChipsHtml +
    statusChipsHtml +
    '<div class="search-row">' +
      '<input type="text" class="search-input" placeholder="🔍 Name, order #, phone or item..." value="' + historySearchQuery.replace(/"/g,'&quot;') + '" oninput="onHistorySearch(this.value)">' +
    '</div>' +
    (historySearchQuery ? '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:var(--muted);margin-bottom:0.8rem;"><input type="checkbox" ' + (historySearchAllDates?'checked':'') + ' onchange="historySearchAllDates=this.checked;loadHistory()"> Search all dates</label>' : '');
}

function toggleHistoryTypeFilter(type) {
  const i = historyTypeFilter.indexOf(type);
  if (i === -1) historyTypeFilter.push(type); else historyTypeFilter.splice(i, 1);
  loadHistory();
}

function toggleHistoryStatusFilter(status) {
  const i = historyStatusFilter.indexOf(status);
  if (i === -1) historyStatusFilter.push(status); else historyStatusFilter.splice(i, 1);
  loadHistory();
}

function clearHistoryFilters() {
  historySearchQuery = '';
  historySearchAllDates = false;
  historyTypeFilter = [];
  historyStatusFilter = [];
  loadHistory();
}

function setHistoryDate(d) {
  historyDate = d || toDateStr(new Date());
  loadHistory();
}

let historySearchDebounce = null;
function onHistorySearch(value) {
  clearTimeout(historySearchDebounce);
  historySearchDebounce = setTimeout(() => { historySearchQuery = value.trim(); loadHistory(); }, 400);
}

function renderHistory(orders) {
  const main = document.getElementById('mainContent');

  // Capture focus + caret BEFORE we blow away the DOM, so a debounce-driven
  // re-render (which replaces the whole search box) doesn't kick the cursor
  // out of the field after the first character. Previously this restoration
  // was an empty stub, so every keystroke past the debounce lost focus and
  // the admin had to re-tap the box for each character.
  const prev = document.querySelector('.search-input');
  const wasFocused = !!prev && document.activeElement === prev;
  const caretStart = wasFocused ? prev.selectionStart : null;
  const caretEnd = wasFocused ? prev.selectionEnd : null;

  if (orders.length === 0) {
    const hasActiveFilters = !!historySearchQuery || historyTypeFilter.length > 0 || historyStatusFilter.length > 0;
    const msg = hasActiveFilters ? 'No orders found matching the selected filters.' : 'No orders found.';
    main.innerHTML = renderHistoryFilters() + '<div class="empty-state">' + msg + '</div>';
  } else {
    main.innerHTML = renderHistoryFilters() + orders.map(renderOrderCard).join('');
  }

  if (wasFocused) {
    const input = document.querySelector('.search-input');
    if (input) {
      input.focus();
      // Restore the caret where it was (default to end if unavailable).
      const len = input.value.length;
      try { input.setSelectionRange(caretStart == null ? len : caretStart, caretEnd == null ? len : caretEnd); }
      catch (e) {}
    }
  }
}

const KNOWN_STATUSES = { printed:'✅ Printed', pending:'⏳ Pending', rejected:'✕ Rejected', voided:'🚫 Voided', cancelled:'🚫 Cancelled', print_failed:'⚠️ Print Failed' };

function renderOrderCard(order) {
  let items = [];
  try { items = JSON.parse(order.items_json || '[]'); } catch(e) {}
  const itemsHtml = items.map(i =>
    '<div class="order-item-row"><span>' + (parseInt(i.quantity, 10) || 0) + 'x ' + escapeHtml(i.product_retailer_id) + '</span><span>₹' + ((i.quantity||0) * (i.item_price||0)) + '</span></div>'
  ).join('');
  const discountAmount = order.discount_amount || 0;
  const grandTotal = order.subtotal + (order.packing_charge||0) - discountAmount + (order.order_type === 'Delivery' ? (order.delivery_charge||0) : 0);
  // "Dine In" -> "Dine-In" so it matches the .order-type-tag.Dine-In CSS
  // rule (same transform the dashboard uses for the same reason).
  const typeClass = String(order.order_type || '').replace(/[^A-Za-z ]/g, '').replace(' ', '-');
  const statusLabel = KNOWN_STATUSES[order.status] || escapeHtml(order.status);
  // Whitelisted class name — never inject a raw status string into an attribute.
  const statusClass = Object.prototype.hasOwnProperty.call(KNOWN_STATUSES, order.status) ? order.status : '';
  const sourceTag = order.source === 'pos' ? ' 🧾 POS' : '';
  const handledTag = order.handled_by
    ? '<span style="font-size:0.68rem;font-weight:700;margin-left:0.4rem;color:' + (order.handled_by === 'manager' ? '#f59e0b' : '#22c55e') + ';">👤 ' + (order.handled_by === 'manager' ? 'Manager' : 'Owner') + '</span>'
    : '';
  // Owner-only remote void: only offered on a live 'printed' order (not one
  // already voided/rejected/delivered/expired). Enforced server-side too.
  const canVoid = (order.status === 'printed' || order.status === 'print_failed') && !order.delivered_at && !order.delivery_expired_at;
  const actionButtons = '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.6rem;">' +
    '<button class="btn-quick" onclick="downloadPdfReceiptRemote(' + order.id + ', \'' + escapeHtml(String(order.order_number)).replace(/'/g, "\\'") + '\', this)">📄 PDF Receipt</button>' +
    (canVoid
      ? '<button class="btn-quick" style="background:rgba(220,38,38,0.15);border-color:var(--red);color:var(--red);" onclick="voidOrderRemote(' + order.id + ', \'' + escapeHtml(String(order.order_number)).replace(/'/g, "\\'") + '\')">🚫 Void this order</button>'
      : '') +
  '</div>';

  return '<div class="order-card">' +
    '<div class="order-header"><span class="order-num">#' + escapeHtml(order.order_number) + sourceTag + handledTag + '</span><span class="order-type-tag ' + typeClass + '">' + escapeHtml(order.order_type) + '</span></div>' +
    '<div class="order-meta">' + escapeHtml(order.customer_name) + ' • ' + escapeHtml(order.customer_phone) + (order.address ? '<br>📍 ' + escapeHtml(order.address) : '') + '<br>🕒 ' + escapeHtml(order.order_time) + '</div>' +
    '<div class="order-items">' + itemsHtml +
      (discountAmount > 0 ? '<div class="order-item-row" style="color:var(--flame);"><span>Discount (' + (order.discount_percent||0) + '%)</span><span>−₹' + discountAmount + '</span></div>' : '') +
      '<div class="order-total">Total: ₹' + grandTotal + '</div></div>' +
    '<span class="status-tag ' + statusClass + '">' + statusLabel + '</span>' +
    (order.out_for_delivery_at ? '<span class="status-tag printed" style="margin-left:0.4rem;">🛵 Out ' + escapeHtml((order.out_for_delivery_at || '').split(', ')[1] || order.out_for_delivery_at) + (order.driver_name ? ' • ' + escapeHtml(order.driver_name) : '') + '</span>' : '') +
    (order.status === 'voided' && order.void_reason ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:0.4rem;">Reason: ' + escapeHtml(order.void_reason) + '</div>' : '') +
    (order.status === 'rejected' && order.reject_reason ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:0.4rem;">Reason: ' + escapeHtml(order.reject_reason) + '</div>' : '') +
    actionButtons +
  '</div>';
}

// Remote void from neitu (owner console). Asks for confirmation + an optional
// reason, calls the same owner-only endpoint the dashboard uses, then reloads
// the current History day so the change shows immediately.
function voidOrderRemote(orderId, orderNumber) {
  if (!confirm('Void order #' + orderNumber + '? This cannot be undone.')) return;
  const reason = (prompt('Reason for voiding (optional):') || '').trim();
  authFetchPost(SERVER_URL + '/api/void-order/' + orderId, { reason: reason })
    .then(r => r.json().then(b => ({ status: r.status, body: b }))).then(({ status, body }) => {
      if (status === 200 && body.status === 'ok') {
        showControlToast('Order #' + orderNumber + ' voided.');
        if (typeof loadHistory === 'function') loadHistory();
      } else if (status === 403) {
        alert('Voiding is restricted to the owner account.');
      } else {
        alert((body && body.message) || 'Could not void the order.');
      }
    }).catch(() => alert('Could not reach the server.'));
}

// Downloads a PDF receipt for one order onto the shop's own letterhead.
// authFetch already carries the dashboard password as a header (not a URL
// param), so a plain link/window.location can't be used here — the request
// has to go through fetch, and the response (a PDF, not JSON) is turned
// into a temporary object URL that a throwaway <a> click downloads.
function downloadPdfReceiptRemote(orderId, orderNumber, btn) {
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing…';
  authFetch(SERVER_URL + '/api/pdf-receipt/' + orderId).then(r => {
    if (r.status === 401) { handleUnauthorized(); throw new Error('__unauthorized'); }
    // The error body is normally JSON with a readable message, but fall back
    // gracefully if it isn't (e.g. an HTML error page from a proxy).
    if (!r.ok) return r.json().catch(() => ({})).then(b => { throw new Error((b && b.message) || ('Could not generate the PDF (server error ' + r.status + ').')); });
    return r.blob();
  }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'receipt_' + orderNumber + '.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    btn.disabled = false; btn.textContent = original;
  }).catch(e => {
    btn.disabled = false; btn.textContent = original;
    if (e.message === '__unauthorized') return;
    // The browser reports every network-level failure (server unreachable, the
    // request blocked, or the shop PC running an older orders.py without this
    // endpoint) as a bare "Failed to fetch" — say something more useful.
    if (e.name === 'TypeError' || e.message === 'Failed to fetch') {
      alert('Could not reach the PDF service. Check the shop PC is online, and that it is running the latest orders.py (restart it after updating).');
    } else {
      alert(e.message || 'Could not download the PDF.');
    }
  });
}

function suggestNextItemCode(category) {
  const items = (currentMenu[category] || []);
  const parsed = items.map(it => {
    const m = /^([A-Za-z]+)([0-9]+)$/.exec(it.id || '');
    return m ? { prefix: m[1], num: parseInt(m[2], 10), width: m[2].length } : null;
  }).filter(Boolean);
  if (parsed.length === 0) return '';
  const counts = {};
  parsed.forEach(p => { counts[p.prefix] = (counts[p.prefix] || 0) + 1; });
  const topPrefix = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const matching = parsed.filter(p => p.prefix === topPrefix);
  const maxNum = Math.max(...matching.map(p => p.num));
  const width = Math.max(...matching.map(p => p.width));
  return topPrefix + String(maxNum + 1).padStart(width, '0');
}

  }

  Object.entries(currentMenu).forEach(([category, items]) => {
    html += '<div class="settings-section" style="margin-top:0.8rem;"><div class="settings-section-title" style="font-size:0.9rem;">' + esc2(category) + '</div>' +
      '<div class="menu-items-grid">';
    items.forEach(item => {
      html += '<div class="cart-item menu-item-card">' +
        '<div style="flex:1;min-width:0;"><div class="cart-item-name">' + esc2(item.title) + (item.is_addon ? ' <span style="color:var(--orange);font-size:0.7rem;">⚡ add-on</span>' : '') + '</div>' +
        '<div style="font-size:0.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc2(item.description || '') + ' · ' + esc2(item.id) + '</div></div>' +
        '<div class="cart-item-price" style="margin-right:0.5rem;white-space:nowrap;">₹' + item.price + '</div>' +
        '<button class="pos-preset-btn" style="flex:0 0 auto;padding:0.35rem 0.6rem;margin-right:0.3rem;font-size:0.78rem;" data-id="' + esc2(item.id) + '" onclick="editMenuItem(this.dataset.id)">Edit</button>' +
        '<button class="pos-preset-btn" style="flex:0 0 auto;padding:0.35rem 0.6rem;font-size:0.78rem;color:var(--flame);border-color:var(--flame);" data-id="' + esc2(item.id) + '" data-title="' + esc2(item.title) + '" onclick="deleteMenuItem(this.dataset.id, this.dataset.title)">Delete</button>' +
      '</div>';
    });
    html += '</div></div>';
  });

  container.innerHTML = html;
}

function confirmMenuChangeWithPassword(summaryLines) {
  const summary = summaryLines.join('\n');
  if (!confirm('Please confirm this menu change:\n\n' + summary + '\n\nYou will be asked for the dashboard password next.')) {
    return false;

function saveMenuItem(originalId) {
  const isEdit = !!originalId;
  const idVal = originalId || document.getElementById('menuItemId').value.trim();
  const titleVal = document.getElementById('menuItemTitle').value.trim();
  const priceVal = parseInt(document.getElementById('menuItemPrice').value, 10);

  // Basic sanity before we bother confirming (the server validates too).
  const categoryVal = selectedMenuCategory();
  if (!categoryVal) {
    alert('Please choose a category (or type a new one) before saving.');
    return;
  }
  if (!idVal || !titleVal || !priceVal || priceVal < 1) {
    alert('Please fill in the item ID, name, and a valid price before saving.');
    return;
  }

  // Show exactly what's about to change, then require the password.
  const summary = isEdit
    ? ['Save changes to: ' + titleVal, 'Item ID: ' + idVal, 'Price: Rs.' + priceVal]
    : ['ADD new item: ' + titleVal, 'Item ID: ' + idVal, 'Price: Rs.' + priceVal];
  if (!confirmMenuChangeWithPassword(summary)) return;

  const payload = {
    id: idVal,
    category: categoryVal,
    title: titleVal,
    description: document.getElementById('menuItemDescription').value.trim(),
    price: priceVal,
    is_addon: document.getElementById('menuItemAddonToggle').classList.contains('on'),
    addon_size: document.getElementById('menuItemAddonSize').value.trim()
  };
  dashFetch('/api/menu/item', { method: 'POST', body: JSON.stringify(payload) })
    .then(r => r.json())
    .then(res => {
      if (res.status !== 'ok') { alert(res.message || 'Could not save item.'); return; }
      menuEditingId = null;
      loadMenuTab();
    })
    .catch(() => alert('Could not reach the server — please try again.'));
}

function deleteMenuItem(itemId, title) {
  // Deletion already confirmed; now also require the password, same as edits.
  if (!confirmMenuChangeWithPassword(['REMOVE from menu: ' + title, 'Item ID: ' + itemId, '(Past orders are unaffected.)'])) return;
  dashFetch('/api/menu/item/delete', { method: 'POST', body: JSON.stringify({ id: itemId }) })
    .then(r => r.json())
    .then(res => {
      if (res.status !== 'ok') { alert(res.message || 'Could not delete item.'); return; }
      loadMenuTab();
    })
    .catch(() => alert('Could not reach the server — please try again.'));
}

function toggleStockExpand(key) {
  if (stockExpanded.has(key)) stockExpanded.delete(key); else stockExpanded.add(key);
  renderStockSection();

function renderStockSection() {
  const el = document.getElementById('stockSection');
  if (!el || !stockGroupsCache) return;

  // Individual item flags are the single source of truth. A group's checkbox
  // is DERIVED: checked when all its items are out, a dash (indeterminate)
  // when only some are, empty when none. So ticking a group marks everything
  // in it out, and unticking brings it all back — no lingering hidden flags.
  const oosIds = new Set();
  stockGroupsCache.groups.forEach(g => g.items.forEach(it => { if (it.active) oosIds.add(it.id); }));
  const oosCount = oosIds.size;

  const groupsHtml = stockGroupsCache.groups.map((g, gi) => {
    const isOpen = stockExpanded.has(g.key);
    const total = g.items.length;
    const activeCount = g.items.filter(it => it.active).length;
    const allOn = total > 0 && activeCount === total;
    const itemsHtml = g.items.map(it =>
      '<label class="stock-toggle-row" style="padding-left:1.8rem;">' +
        '<input type="checkbox" ' + (it.active ? 'checked' : '') + ' onchange="toggleStockItem(&quot;' + it.id + '&quot;, this.checked)">' +
        '<span>' + it.title + '</span>' +
      '</label>'
    ).join('');
    const countLabel = activeCount ? (activeCount + ' of ' + total + ' out') : (total + ' items');
    return '<div class="stock-group-block">' +
      '<label class="stock-toggle-row">' +
        '<input type="checkbox" id="stockGrpChk_' + gi + '" ' + (allOn ? 'checked' : '') + ' onchange="toggleStockGroup(&quot;' + g.key + '&quot;, this.checked)">' +
        '<span style="flex:1;">' + g.label + ' <span class="stock-count">(' + countLabel + ')</span></span>' +
        '<span onclick="toggleStockExpand(&quot;' + g.key + '&quot;)" style="cursor:pointer;padding:0.2rem 0.5rem;color:var(--muted);">' + (isOpen ? '▾' : '▸') + '</span>' +
      '</label>' +
      (isOpen ? '<div class="stock-group-items">' + itemsHtml + '</div>' : '') +
    '</div>';
  }).join('');

  el.innerHTML =
    '<div class="settings-section">' +
      '<div class="settings-section-title">📦 Out of Stock</div>' +
      '<div style="font-size:0.82rem;color:var(--muted);margin-bottom:0.7rem;line-height:1.5;">Changes take effect immediately on the website and POS — no need to hit Save Settings. Tick a group to mark everything in it out of stock; untick it to bring it all back. Tap ▸ to expand a group and toggle single items.</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.8rem;">' +
        '<span style="font-size:0.85rem;font-weight:700;' + (oosCount ? 'color:var(--red);' : 'color:var(--green);') + '">' + (oosCount ? ('⛔ ' + oosCount + ' item' + (oosCount === 1 ? '' : 's') + ' out of stock') : '✅ Everything in stock') + '</span>' +
        (oosCount ? '<button class="btn-reprint" style="flex-shrink:0;" onclick="clearAllStock()">↩ Mark all back in stock</button>' : '') +
      '</div>' +
      groupsHtml +
    '</div>';

  // indeterminate can't be set via an HTML attribute — set it after render.
  stockGroupsCache.groups.forEach((g, gi) => {
    const total = g.items.length, activeCount = g.items.filter(it => it.active).length;
    const chk = document.getElementById('stockGrpChk_' + gi);
    if (chk) chk.indeterminate = activeCount > 0 && activeCount < total;
  });
}

function toggleStockGroup(key, checked) {
  if (!dashPassword) {
    dashPassword = prompt('Re-enter dashboard password:') || '';
    if (!dashPassword) { loadStockSection(); return; }
  }
  // Cascade to every item in the group (updating all copies of shared item
  // ids across groups so their state stays consistent), then save.
  const grp = stockGroupsCache.groups.find(g => g.key === key);
  if (!grp) return;
  const ids = new Set(grp.items.map(it => it.id));
  stockGroupsCache.groups.forEach(g => g.items.forEach(it => { if (ids.has(it.id)) it.active = checked; }));
  saveStockItems();
}

function toggleStockItem(id, checked) {
  if (!dashPassword) {
    dashPassword = prompt('Re-enter dashboard password:') || '';
    if (!dashPassword) { loadStockSection(); return; }
  }
  // Update every copy of this id (an item can appear under more than one group).
  stockGroupsCache.groups.forEach(g => g.items.forEach(it => { if (it.id === id) it.active = checked; }));
  saveStockItems();
}

function clearAllStock() {
  if (!confirm('Mark ALL items back in stock?')) return;
  if (!dashPassword) {
    dashPassword = prompt('Re-enter dashboard password:') || '';
    if (!dashPassword) return;
  }
  stockGroupsCache.groups.forEach(g => g.items.forEach(it => { it.active = false; }));
  saveStockItems();
}

function onReportPeriodChange() {
  const sel = document.getElementById('reportPeriod');
  const custom = document.getElementById('reportCustomRange');
  if (!sel || !custom) return;
  const isCustom = (sel.value === 'custom');
  custom.style.display = isCustom ? 'flex' : 'none';
  if (isCustom) {
    // Seed the custom inputs with a sensible default (this month so far).
    const s = document.getElementById('reportStart');
    const e = document.getElementById('reportEnd');
    const now = new Date();
    if (s && !s.value) s.value = toDateStr(new Date(now.getFullYear(), now.getMonth(), 1));
    if (e && !e.value) e.value = toDateStr(now);
  }
  updateReportPreview();
}

function updateReportPreview() {
  // Show exactly which dates the Send button will use, live.
  const el = document.getElementById('reportDatePreview');
  const sel = document.getElementById('reportPeriod');
  if (!el || !sel) return;
  const r = reportPeriodRange();
  if (sel.value === 'custom' && (!r.start || !r.end)) {
    el.textContent = 'Pick both dates above.';
    return;
  }
  if (r.start > r.end) {
    el.textContent = '⚠️ Start date is after end date.';
    return;
  }
  const range = (r.start === r.end) ? r.start : (r.start + ' to ' + r.end);
  // For named periods, show the label too; custom just shows the dates.
  el.textContent = 'Will send: ' + (sel.value === 'custom' ? range : (r.label + ' (' + range + ')'));
}

function reportPeriodRange() {
  // Resolve the selected period to concrete { start, end, label } dates,
  // mirroring the date maths the Sales tab already uses (local time).
  const sel = document.getElementById('reportPeriod');
  const val = sel ? sel.value : 'today';
  const now = new Date();
  if (val === 'yesterday') {
    const y = new Date(now); y.setDate(now.getDate() - 1);
    const d = toDateStr(y);
    return { start: d, end: d, label: 'Yesterday' };
  }
  if (val === 'month') {
    return { start: toDateStr(new Date(now.getFullYear(), now.getMonth(), 1)), end: toDateStr(now), label: 'This Month' };
  }
  if (val === 'lastmonth') {
    const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const last = new Date(now.getFullYear(), now.getMonth(), 0); // day 0 = last day of prev month
    return { start: toDateStr(first), end: toDateStr(last), label: 'Last Month' };
  }
  if (val === 'custom') {
    const s = document.getElementById('reportStart');
    const e = document.getElementById('reportEnd');
    return { start: (s && s.value) || '', end: (e && e.value) || '', label: 'Custom' };
  }
  const t = toDateStr(now);
  return { start: t, end: t, label: 'Today' };
}

function collectSettingsFromForm() {
  syncQtyOfferRulesFromDOM();

  const delivery_drivers = [];
  document.querySelectorAll('.driver-row').forEach(row => {
    const name = row.querySelector('.driver-name').value.trim();
    const phone = row.querySelector('.driver-phone').value.replace(/\D/g, '');
    const token = row.getAttribute('data-token') || '';
    if (name) delivery_drivers.push(token ? { name, phone, token } : { name, phone });
  });

  const banner = {
    active: document.getElementById('bannerToggle').classList.contains('on'),
    text: document.getElementById('bannerText').value.trim(),
    emoji: document.getElementById('bannerEmoji').value.trim() || '🎉'
  };

  const threshold_offer = {
    active: document.getElementById('offerToggle').classList.contains('on'),
    threshold_amount: parseInt(document.getElementById('offerThreshold').value) || 0,
    discount_percent: Math.max(0, Math.min(100, parseInt(document.getElementById('offerPercent').value) || 0))
  };

  const special_dates = {};
  let dateError = null;
  document.querySelectorAll('.special-date-card').forEach(card => {
    const dateKey = card.dataset.date;
    if (!dateKey) return;
    const label = card.querySelector('[data-field="label"]').value.trim();
    const closedToggle = card.querySelector('[data-field="closed"]');
    const isClosed = closedToggle.classList.contains('on');
    if (isClosed) {
      special_dates[dateKey] = { open: null, close: null, label: label };
    } else {
      const openRaw = card.querySelector('[data-field="open"]').value.trim();
      const closeRaw = card.querySelector('[data-field="close"]').value.trim();
      const open = parseFloat(openRaw);
      const close = parseFloat(closeRaw);
      // Validate: a date that ISN'T force-closed must have real hours.
      // Previously a blank field became NaN -> JSON null -> the server read
      // it as "closed all day", so accidentally clearing an hours field
      // silently shut ordering for that date. Now we refuse the save and say
      // why (or the user can flip "Force closed all day" on purpose).
      if (openRaw === '' || closeRaw === '' || isNaN(open) || isNaN(close) ||
          open < 0 || open > 24 || close < 0 || close > 24 || close <= open) {
        if (!dateError) {
          dateError = 'Special date "' + (label || dateKey) + '" has invalid hours. '
            + 'Enter both open and close times (0–24, close after open), '
            + 'or turn on "Force closed all day".';
        }
        return;
      }
      special_dates[dateKey] = { open: open, close: close, label: label };
    }
  });
  if (dateError) { alert(dateError); return null; }

  const preorder_time = {
    active: document.getElementById('preorderToggle').classList.contains('on'),
    label: (document.getElementById('preorderLabel').value || '').trim() || 'When should your order be ready?',
    options: (document.getElementById('preorderOptions').value || '').split(',').map(s => s.trim()).filter(Boolean)
  };

  const delivery_control = {
    paused: document.getElementById('deliveryPauseToggle').classList.contains('on'),
    cutoff_enabled: document.getElementById('deliveryCutoffToggle').classList.contains('on'),
    cutoff_time: (document.getElementById('deliveryCutoffTime').value || '21:00'),
    message: (document.getElementById('deliveryMessage').value || '').trim()
  };

  // pos_disabled_types is NOT collected here — it saves itself immediately,
  // one toggle at a time, each gated behind a re-typed password. See
  // togglePosDisabledType(). Bundling it into this generic Save Settings
  // payload would also break the save for managers, who don't have this
  // category (and therefore these DOM elements) at all.

  const printerSel = document.getElementById('printerSelect');
  const printer_name = printerSel ? printerSel.value : (currentSettings.printer_name || '');

  // Weekly opening hours — 7 entries, Sunday..Saturday. Closed day = null.
  let weekly_hours = null;
  let hoursError = null;
  if (document.querySelector('.hours-row')) {
    weekly_hours = [];
    for (let i = 0; i < 7; i++) {
      const closedEl = document.getElementById('hrClosed' + i);
      if (closedEl && closedEl.classList.contains('on')) { weekly_hours.push(null); continue; }
      const o = (document.getElementById('hrOpen' + i) || {}).value || '';
      const c = (document.getElementById('hrClose' + i) || {}).value || '';
      const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t); return m ? (+m[1]) * 60 + (+m[2]) : null; };
      const om = toMin(o), cm = toMin(c);
      if (om == null || cm == null || cm <= om) {
        hoursError = 'Opening hours for ' + ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i] +
          ' are invalid — set both open and close (close after open), or toggle Closed.';
        break;
      }
      weekly_hours.push({ open: o, close: c });
    }
  }
  if (hoursError) { alert(hoursError); return null; }

  // Packing charges — 4 flat per-item rates. Missing/invalid fields fall
  // back to the previously saved value rather than blocking the whole save.
  let packing_rates = null;
  if (document.getElementById('pkRate_pizza_small')) {
    const prev = currentSettings.packing_rates || { pizza_small: 5, pizza_large: 7, footlong_sandwich: 5, chicken: 5, bowls: 8, snack_box: 3, wraps: 4, burgers: 0 };
    packing_rates = {};
    ['pizza_small', 'pizza_large', 'footlong_sandwich', 'chicken', 'bowls', 'snack_box', 'wraps', 'burgers'].forEach(key => {
      const el = document.getElementById('pkRate_' + key);
      const val = el ? parseInt(el.value) : NaN;
      packing_rates[key] = (!isNaN(val) && val >= 0) ? val : (prev[key] != null ? prev[key] : 0);
    });
  }

  const out = { banner, special_dates, threshold_offer, qty_offers: currentSettings.qty_offers || [], delivery_drivers, preorder_time, delivery_control, printer_name };

function saveReportSchedule() {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const schedule = [];
  for (let i = 0; i < 7; i++) {
    const off = document.getElementById('rsOff' + i);
    if (off && off.classList.contains('on')) { schedule.push(null); continue; }
    const t = ((document.getElementById('rsTime' + i) || {}).value || '').trim();
    if (!/^([01]?\d|2[0-3]):[0-5]\d$/.test(t)) {
      alert('Please set a valid send time for ' + days[i] + ', or switch it to No report.');
      return;
    }
    schedule.push(t);
  }
  dashFetch('/api/settings', {
    method: 'POST',
    body: JSON.stringify({ report_schedule: schedule })
  }).then(r => r.json().then(body => ({status: r.status, body}))).then(({status, body}) => {
    if (status === 200 && body.status === 'ok') {
      alert('Report schedule saved!');
      currentSettings.report_schedule = schedule;
    } else {
      alert('Failed to save: ' + (body.message || 'Unknown error'));
    }
  }).catch(e => { alert('Failed to save report schedule.'); console.log(e); });
}

function downloadAuthedFile(path, fallbackName) {
  dashFetch(path).then(r => {
    if (!r.ok) throw new Error('bad status');
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    const name = m ? m[1] : fallbackName;
    return r.blob().then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
  }).catch(e => alert('Download failed — check the connection and try again.'));
}

function saveOwnerPassword(btn) {
  const cur = (document.getElementById('ownCurPw') || {}).value || '';
  const nw = ((document.getElementById('ownNewPw') || {}).value || '').trim();
  const nw2 = ((document.getElementById('ownNewPw2') || {}).value || '').trim();
  if (nw.length < 4) { alert('New password must be at least 4 characters.'); return; }
  if (nw !== nw2) { alert('The two new-password fields do not match.'); return; }
  btn.disabled = true;
  dashFetch('/api/set-owner-password', { method: 'POST', body: JSON.stringify({ current_password: cur, new_password: nw }) })
    .then(r => r.json().then(b => ({status: r.status, body: b}))).then(({status, body}) => {
      btn.disabled = false;
      if (status === 200 && body.status === 'ok') {
        // The password we authenticate future calls with just changed — update
        // the in-memory + stored password so this session keeps working.
        dashPassword = nw;
        sessionStorage.setItem('gi_admin_auth_pw', nw);
        ['ownCurPw','ownNewPw','ownNewPw2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        alert('Owner password changed. Use the new password next time you log in.');
      } else {
        alert((body && body.message) || 'Could not change the password.');
      }
    }).catch(() => { btn.disabled = false; alert('Could not reach the server.'); });
}
